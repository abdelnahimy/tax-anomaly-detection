[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra : résumé de tous les tests non passants (dont les skips), utile pour voir
#       d'un coup d'œil ce qui a été sauté faute de modèle entraîné.
addopts = -ra --strict-markers

markers =
    slow: test nécessitant le modèle entraîné (models/xgboost_v2_best.pkl)

filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
